name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate version is newer than published appcast
        # Refuses to release a version that is not strictly newer than what is
        # already in the Sparkle feed — catches duplicate/recycled tags before
        # the expensive build+notarize pipeline runs.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sfL "https://raw.githubusercontent.com/jokull/ruv-noise/gh-pages/appcast.xml" \
            -o appcast-current.xml || { echo "no existing appcast — first release, OK"; exit 0; }
          python3 - "$VERSION" <<'PY'
          import re, sys
          def parse(v):
              return [int(p) for p in re.findall(r'\d+', v)] or [0]
          def cmp(a, b):
              for x, y in zip(a, b):
                  if x != y: return 1 if x > y else -1
              return (len(a) > len(b)) - (len(a) < len(b))
          new = parse(sys.argv[1])
          xml = open('appcast-current.xml', encoding='utf-8').read()
          versions = re.findall(
              r'<sparkle:shortVersionString>([^<]+)</sparkle:shortVersionString>', xml)
          if not versions:
              print("appcast has no versioned entries — OK")
              sys.exit(0)
          latest = max(versions, key=parse)
          print(f"tagged version: {sys.argv[1]}, latest published: {latest}")
          if cmp(new, parse(latest)) <= 0:
              print(f"ERROR: {sys.argv[1]} is not newer than already-published {latest} — refusing to release")
              sys.exit(1)
          PY

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain

      - name: Build
        run: |
          xcodebuild \
            -project RuvNoise.xcodeproj \
            -scheme RuvNoise \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=RDC8539AWM \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Re-sign Sparkle nested executables
        # Sparkle.framework ships its nested helpers (Updater.app, XPC services,
        # Autoupdate) adhoc-signed. Apple's notarization rejects adhoc-signed
        # nested code, so re-sign them deepest-first with the Developer ID,
        # then the framework and the app so the seals cover the new signatures.
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/RuvNoise.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          IDENTITY="Developer ID Application"

          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW/Updater.app"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW/XPCServices/Downloader.xpc"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW/XPCServices/Installer.xpc"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW/Autoupdate"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$FW"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/RuvNoise.app"
          STAGING="build/dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "RuvNoise" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "RuvNoise.dmg"

      - name: Notarize
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
          APPSTORE_CONNECT_API_KEY: ${{ secrets.APPSTORE_CONNECT_API_KEY }}
        run: |
          echo "$APPSTORE_CONNECT_API_KEY" | base64 --decode > AuthKey.p8
          xcrun notarytool submit RuvNoise.dmg \
            --key AuthKey.p8 \
            --key-id "$APPSTORE_CONNECT_API_KEY_ID" \
            --issuer "$APPSTORE_CONNECT_API_KEY_ISSUER_ID" \
            --wait

      - name: Staple
        run: |
          # The ticket can lag a few seconds behind notarytool --wait; retry.
          for i in 1 2 3 4 5 6; do
            if xcrun stapler staple RuvNoise.dmg; then
              exit 0
            fi
            echo "stapler attempt $i failed — retrying in 10s"
            sleep 10
          done
          exit 1

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: RuvNoise.dmg
          generate_release_notes: true

      - name: Generate and publish Sparkle appcast
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
          SPARKLE_VERSION: 2.9.6
        run: |
          set -euo pipefail

          # Download the Sparkle tools (generate_appcast needs the private EdDSA key)
          curl -sL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          tar xf sparkle.tar.xz
          # The tarball extracts bin/, Sparkle.framework/, etc. into the CWD — not a
          # Sparkle-<version>/ subdirectory.
          SPARKLE_BIN="${PWD}/bin"

          # Stage the new DMG (plus the previous appcast so generate_appcast can update it)
          mkdir -p appcast-work
          cp RuvNoise.dmg appcast-work/
          curl -sfL "https://raw.githubusercontent.com/jokull/ruv-noise/gh-pages/appcast.xml" \
            -o appcast-work/appcast.xml || true

          # Generate + sign the appcast, pointing enclosures at this release's assets
          echo "$SPARKLE_ED25519_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/jokull/ruv-noise/releases/download/${GITHUB_REF_NAME}/" \
            appcast-work

          # Guard: the new version must actually appear in the generated feed,
          # otherwise publishing a stale appcast would silently break updates.
          python3 - "$GITHUB_REF_NAME" appcast-work/appcast.xml <<'PY'
          import re, sys
          ver = sys.argv[1].lstrip("v")
          xml = open(sys.argv[2], encoding='utf-8').read()
          versions = re.findall(
              r'<sparkle:shortVersionString>([^<]+)</sparkle:shortVersionString>', xml)
          if ver not in versions:
              print(f"ERROR: generated appcast does not contain {ver} (has {versions}) — aborting publish")
              sys.exit(1)
          print(f"appcast contains {ver} — OK")
          PY

          # Publish appcast.xml to the gh-pages branch
          git fetch origin gh-pages
          git worktree add --detach gh-pages-wt origin/gh-pages
          cp appcast-work/appcast.xml gh-pages-wt/appcast.xml
          git -C gh-pages-wt config user.name "github-actions[bot]"
          git -C gh-pages-wt config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C gh-pages-wt add appcast.xml
          git -C gh-pages-wt commit -m "Update Sparkle appcast for ${GITHUB_REF_NAME}"
          git -C gh-pages-wt push origin HEAD:gh-pages
