name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version setup
        # MARKETING_VERSION must be identical in both build configs, and both
        # CFBundleShortVersionString and CFBundleVersion must derive from it
        # (Sparkle compares CFBundleVersion first — drift silently kills
        # auto-updates).
        run: |
          set -euo pipefail
          UNIQUE=$(grep -oE 'MARKETING_VERSION = [^;]+' \
            RuvNoise.xcodeproj/project.pbxproj | sort -u | wc -l | tr -d ' ')
          [ "$UNIQUE" = "1" ] || { echo "ERROR: MARKETING_VERSION differs between build configs"; exit 1; }
          grep -q '\$(MARKETING_VERSION)' RuvNoise/Info.plist \
            || { echo "ERROR: Info.plist must use \$(MARKETING_VERSION)"; exit 1; }
          grep -q 'CFBundleVersion' RuvNoise/Info.plist \
            || { echo "ERROR: Info.plist missing CFBundleVersion"; exit 1; }
          echo "version setup OK"

      - name: Build
        run: xcodebuild -project RuvNoise.xcodeproj -scheme RuvNoise -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES

      - name: Upload app
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && matrix.os == 'macos-15'
        with:
          name: RuvNoise.app
          path: build/Build/Products/Release/RuvNoise.app
